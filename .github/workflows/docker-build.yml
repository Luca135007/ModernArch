name: CI 測試與推播

on:
  push:
    branches: [ "master" ]

# 【新增】給予機器人寫入貨櫃場 (Packages) 的權限
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 取得原始碼
      uses: actions/checkout@v4

    # 【新增】步驟 2：拿著臨時通行證，登入 GitHub Container Registry (GHCR)
    - name: 登入 GitHub 貨櫃場
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 【修改】步驟 3：打包並推送到貨櫃場
    - name: 建立與推播 Docker 映像檔
      working-directory: ./ModernArch.Api
      # ⚠️ 注意：Docker 規定映像檔名稱必須「全小寫」
      # 格式為：ghcr.io/你的帳號(全小寫)/自訂名稱:版本標籤
      run: |
        docker build -t ghcr.io/luca135007/modern-arch-api:latest .
        docker push ghcr.io/luca135007/modern-arch-api:latest