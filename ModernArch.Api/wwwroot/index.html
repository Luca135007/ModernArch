<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的待辦事項</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 8px; }
        button { padding: 8px 16px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: #f4f4f4; margin: 5px 0; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 完成項目的樣式 */
        .completed-text { text-decoration: line-through; color: #888; }
        .todo-content { display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <h1>我的待辦事項 (API 串接版)</h1>
    
    <div class="input-group">
        <input type="text" id="todoInput" placeholder="輸入待辦事項...">
        <button id="addBtn">新增</button>
    </div>

    <ul id="todoList">
        <!-- 這裡會動態插入資料 -->
    </ul>

    <script>
        // 動態構建 API URL，支援本地開發和 GitHub Codespaces
        function getApiBaseUrl() {
            // 在 Codespaces 中，前端和後端在同一個域名下，使用相對路徑即可
            // 在本地開發中，也使用相對路徑（因為前端由後端的 wwwroot 提供）
            return '/api/Todo';
        }

        const API_BASE_URL = getApiBaseUrl(); 
        console.log('API Base URL:', API_BASE_URL); // 方便除錯

        // 1. 載入時取得資料
        async function fetchTodos() {
            try {
                const response = await fetch(API_BASE_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const todos = await response.json();
                renderTodos(todos);
            } catch (error) {
                console.error('錯誤:', error);
                console.error('當前 URL:', window.location.href);
                console.error('API URL:', API_BASE_URL);
                alert('無法連接 API，請確認：\n1. 後端服務有在運行嗎？\n2. 請檢查瀏覽器控制台 (F12) 查看詳細錯誤訊息');
            }
        }

        // 2. 渲染畫面 (修改：使用安全的 DOM 操作)
        function renderTodos(todos) {
            const list = document.getElementById('todoList');
            if (!list) return; // 空值檢查

            list.innerHTML = ''; // 清空舊資料

            todos.forEach(todo => {
                const li = document.createElement('li');

                // 建立內容容器
                const contentDiv = document.createElement('div');
                contentDiv.className = 'todo-content';

                // 建立 checkbox
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.isCompleted;
                checkbox.addEventListener('change', function() {
                    toggleTodo(todo.id, todo.title, this.checked);
                });

                // 建立文字標籤 (使用 textContent 防止 XSS)
                const span = document.createElement('span');
                span.textContent = todo.title;
                if (todo.isCompleted) {
                    span.className = 'completed-text';
                }

                // 建立刪除按鈕
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '刪除';
                deleteBtn.addEventListener('click', function() {
                    deleteTodo(todo.id);
                });

                // 組裝元素
                contentDiv.appendChild(checkbox);
                contentDiv.appendChild(span);
                li.appendChild(contentDiv);
                li.appendChild(deleteBtn);
                list.appendChild(li);
            });
        }

        // 3. 新增資料
        async function addTodo() {
            const input = document.getElementById('todoInput');
            if (!input || !(input instanceof HTMLInputElement)) return; // 空值和類型檢查

            const title = input.value.trim();
            if (!title) return alert("請輸入內容！");

            const newTodo = { title: title, isCompleted: false };

            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newTodo)
                });

                if (response.ok) {
                    input.value = ''; // 清空輸入框
                    fetchTodos();     // 重新載入列表
                } else {
                    alert("新增失敗");
                }
            } catch (error) {
                console.error("新增錯誤:", error);
            }
        }

        // 4. 刪除資料
        async function deleteTodo(id) {
            if(!confirm('確定刪除嗎？')) return;
            
            try {
                await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'DELETE'
                });
                fetchTodos();
            } catch (error) {
                console.error("刪除錯誤:", error);
            }
        }

        // 5. 切換完成狀態 (關鍵修改：呼叫 PUT)
        async function toggleTodo(id, title, isChecked) {
            // 準備要傳給後端的資料 (必須包含 Id, Title, IsCompleted)
            const updatedTodo = { 
                id: id, 
                title: title, 
                isCompleted: isChecked 
            };

            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedTodo)
                });

                if (response.ok) {
                    fetchTodos(); // 更新成功後，重新整理畫面確保同步
                } else {
                    alert("更新狀態失敗");
                    fetchTodos(); // 失敗的話也要重整，把勾勾跳回來
                }
            } catch (error) {
                console.error("更新錯誤:", error);
            }
        }

        // 頁面載入後執行
        document.addEventListener('DOMContentLoaded', function() {
            // 綁定新增按鈕事件
            const addBtn = document.getElementById('addBtn');
            if (addBtn) {
                addBtn.addEventListener('click', addTodo);
            }

            // 綁定 Enter 鍵事件
            const todoInput = document.getElementById('todoInput');
            if (todoInput) {
                todoInput.addEventListener('keypress', function(event) {
                    if (event.key === 'Enter') {
                        addTodo();
                    }
                });
            }

            // 載入待辦事項
            fetchTodos();
        });
    </script>
</body>
</html>
